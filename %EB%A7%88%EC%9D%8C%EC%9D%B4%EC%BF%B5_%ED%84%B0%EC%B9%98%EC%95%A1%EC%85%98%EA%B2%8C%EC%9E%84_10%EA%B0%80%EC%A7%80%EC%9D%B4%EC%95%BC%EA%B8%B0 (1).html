<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3da">
<title>마음이 쿵! 터치 액션 놀이터 - 10가지 이야기</title>
<style>
:root{--ink:#48415c;--cream:#fffaf0;--pink:#ff80b5;--blue:#55b9f5;--yellow:#ffe47d;--mint:#8be5c3;--shadow:0 13px 0 rgba(87,80,131,.11),0 22px 34px rgba(87,80,131,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 7% 13%,#ffe8f6 0 12%,transparent 32%),radial-gradient(circle at 95% 3%,#d9f7ff 0 10%,transparent 36%),linear-gradient(160deg,#fff6df 0%,#f5fcff 52%,#fff0f8 100%);padding:14px 16px 20px;overscroll-behavior-y:contain}
.app{max-width:1280px;margin:auto}
.top{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;padding:4px 5px}
.brand{display:flex;align-items:center;gap:11px}.mascot{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#ffdb91,#ff92c1);font-size:32px;transform:rotate(-6deg);box-shadow:0 6px 0 rgba(239,129,147,.25)}
.brand h1{margin:0;font-size:clamp(22px,2.8vw,34px);letter-spacing:-1.4px;font-weight:1000;line-height:1.18}.brand p{margin:4px 0 0;font-size:12px;color:#857e9d;font-weight:750}
.header-right{display:flex;align-items:center;gap:8px}.score{border:3px solid white;background:#fff;box-shadow:0 5px 12px #9186b025;border-radius:22px;padding:10px 17px;display:flex;align-items:center;gap:9px;font-size:20px;font-weight:1000}.score span{font-size:13px;color:#77718d}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #5aadee;outline-offset:3px}
.smallbtn{background:white;color:var(--ink);border:3px solid #fff;border-radius:19px;min-width:52px;height:52px;padding:0 13px;box-shadow:0 6px 12px #9186b025;font-size:23px;transition:transform .12s}.smallbtn:active,.scene-tab:active,.bottom-btn:active{transform:scale(.94)}
.tabs{display:flex;gap:9px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:thin;scrollbar-color:#f4aec9 transparent}
.scene-tab{position:relative;flex:1 0 140px;min-height:66px;border:none;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 12px rgba(82,75,124,.08);color:#6d6685;font-weight:950;transition:transform .16s,background .16s;border:3px solid white}
.scene-tab .tabemoji{font-size:29px;filter:drop-shadow(0 3px 2px #7f71952b)}.scene-tab span:last-child{font-size:clamp(13px,1.5vw,17px)}.scene-tab.active{background:linear-gradient(140deg,#ffeff7,#fffbdd);border-color:#ffc4dd;transform:translateY(-2px);color:#584b6a}.scene-tab.done:after{content:"💗";position:absolute;right:3px;top:-5px;font-size:17px}
.frame{position:relative;background:#fff;border:7px solid white;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);isolation:isolate}
.frame:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#e9f9ff,#f6faff);pointer-events:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:1120/650;position:relative;z-index:1;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.canvas-sticker{position:absolute;z-index:2;top:14px;left:14px;border-radius:19px;padding:9px 16px;background:rgba(255,255,255,.88);box-shadow:0 6px 17px #7b75a21d;font-weight:1000;font-size:clamp(13px,1.7vw,20px);pointer-events:none}
.canvas-sub{position:absolute;z-index:2;top:63px;left:16px;background:#ffffffd4;padding:7px 12px;border-radius:13px;font-size:clamp(11px,1.25vw,15px);font-weight:800;pointer-events:none}
.bottombar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:12px 10px 5px}.reacttext{display:flex;align-items:center;gap:11px;min-width:230px;flex:1;background:#fff;border-radius:22px;padding:12px 17px;box-shadow:0 7px 14px #8a80aa12;font-weight:850;font-size:clamp(14px,1.55vw,19px);min-height:60px}.reacticon{font-size:29px;flex:none;animation:wiggle 2.7s infinite}.actions{display:flex;gap:9px;flex-wrap:wrap}.bottom-btn{border:none;border-radius:20px;padding:13px 16px;min-height:55px;box-shadow:0 6px 0 #d6baba55;color:#4f4964;font-weight:1000;font-size:clamp(14px,1.5vw,17px);background:#fff;white-space:nowrap}.bottom-btn.next{color:#613d50;background:linear-gradient(120deg,#ffb5d1,#ffe4aa)}.bottom-btn.reset{background:#e8f8ff}
.missionpanel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:3px solid #fff;border-radius:21px;padding:10px 14px;margin:0 0 13px;box-shadow:0 7px 16px rgba(82,75,124,.09)}
.missionname{font-size:15px;font-weight:1000;white-space:nowrap}.missiongoal{font-size:13px;color:#79718f;font-weight:800;flex:1;min-width:150px}
.missionstart{border:0;color:#634259;background:linear-gradient(110deg,#fff0a1,#ffb1d8);border-radius:15px;padding:10px 16px;min-height:45px;font-weight:1000;box-shadow:0 5px 0 #e99db555}
.missionstart:active{transform:scale(.96)}
.missiontime{display:flex;align-items:center;gap:7px;min-width:100px;font-size:16px;font-weight:1000;color:#e26b96}
.missiontrack{width:102px;height:13px;background:#f5eaf6;border-radius:99px;overflow:hidden}.missionfill{height:100%;width:100%;background:linear-gradient(90deg,#a0efd2,#ffd980,#ff9cb9);transition:width .15s linear}
.missionpanel.active{background:linear-gradient(110deg,#fff4df,#fff0f8);border-color:#ffe0a1;animation:glowPulse 1s ease-in-out infinite alternate}
@keyframes glowPulse{to{box-shadow:0 4px 20px #ffd07c80}}
.challengeinfo{background:#fffdf7;border-radius:19px;padding:9px 16px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:850;color:#847995}
.challengeinfo b{color:#d76d9a}
.scene-tab{flex-basis:157px!important}.scene-tab span:last-child{white-space:nowrap}
.scene-tab.active{background:linear-gradient(140deg,#fff5e1,#ffe5f6)!important}
.frame:after{content:"";pointer-events:none;position:absolute;z-index:2;inset:0;border-radius:24px;box-shadow:inset 0 0 28px #fff9,inset 0 0 0 3px #ffffff33}
@media(max-width:650px){.missionpanel{padding:8px}.missionname{font-size:13px}.missiongoal{font-size:11px}.missiontrack{width:55px}.missionstart{padding:9px 12px;min-height:43px}.challengeinfo{font-size:12px}}
.tiny{font-weight:750;color:#9389a5;text-align:center;font-size:13px;margin:10px auto 0}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-13deg)}96%{transform:rotate(12deg)}}
.toast{position:absolute;z-index:3;top:20%;left:50%;transform:translateX(-50%) scale(.9);pointer-events:none;border:4px solid white;background:#fff7e5;padding:13px 24px;border-radius:25px;font-size:30px;font-weight:1000;opacity:0;white-space:nowrap;box-shadow:0 10px 25px #47406425}.toast.show{animation:toastpop 1.1s ease-out forwards}@keyframes toastpop{0%{transform:translateX(-50%) scale(.5);opacity:0}20%{transform:translateX(-50%) scale(1.07);opacity:1}75%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) scale(1.06);opacity:0}}
@media(max-width:650px){body{padding:9px 7px 15px}.top{gap:6px;margin-bottom:7px}.brand h1{font-size:22px}.brand p{display:none}.mascot{height:45px;width:45px;font-size:25px}.score{padding:6px 10px;font-size:16px}.smallbtn{height:43px;min-width:43px;font-size:20px}.tabs{gap:6px;padding-bottom:9px}.scene-tab{flex-basis:114px;min-height:56px;gap:5px;border-radius:16px}.scene-tab .tabemoji{font-size:24px}.frame{border-width:4px;border-radius:20px}.canvas-sticker{top:5px;left:7px;padding:5px 9px;border-radius:12px;font-size:12px}.canvas-sub{display:none}.bottombar{padding:10px 0}.reacttext{min-width:100%;font-size:14px;min-height:56px}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.bottom-btn{min-height:50px;padding:10px}.tiny{font-size:11px}}
@media (prefers-reduced-motion:reduce){.reacticon{animation:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><div class="mascot">⚡</div><div><h1>마음이 쿵! 터치 액션</h1><p>우리 마음을 잇는 약속 · 신나는 10가지 감정 모험</p></div></div>
    <div class="header-right"><div class="score" aria-label="배려 하트"><b>💖</b><b id="heartCount">0</b><span>마음 하트</span></div><button class="smallbtn" id="soundBtn" aria-label="효과음 끄기">🔊</button><button class="smallbtn" id="musicBtn" aria-label="배경음악 켜기">🎵</button><button class="smallbtn" id="fullBtn" aria-label="전체 화면">⛶</button></div>
  </header>
  <nav class="tabs" aria-label="놀이 장소 선택">
    <button class="scene-tab active" data-scene="0"><span class="tabemoji">🧱</span><span>블록 놀이</span></button>
    <button class="scene-tab" data-scene="1"><span class="tabemoji">⚽</span><span>공 놀이터</span></button>
    <button class="scene-tab" data-scene="2"><span class="tabemoji">🎨</span><span>물감 놀이</span></button>
    <button class="scene-tab" data-scene="3"><span class="tabemoji">🍱</span><span>급식 줄</span></button>
    <button class="scene-tab" data-scene="4"><span class="tabemoji">🧸</span><span>정리 놀이</span></button>
    <button class="scene-tab" data-scene="5"><span class="tabemoji">✏️</span><span>연필 사건</span></button>
    <button class="scene-tab" data-scene="6"><span class="tabemoji">🖼️</span><span>그림 낙서</span></button>
    <button class="scene-tab" data-scene="7"><span class="tabemoji">🪄</span><span>외로운 친구</span></button>
    <button class="scene-tab" data-scene="8"><span class="tabemoji">☔</span><span>비 오는 날</span></button>
    <button class="scene-tab" data-scene="9"><span class="tabemoji">🎤</span><span>발표 시간</span></button>
  </nav>
  <div class="missionpanel" id="missionPanel"><span class="missionname">⚡ 번개 미션</span><span class="missiongoal" id="missionGoal">장난도 해 보고, 친구 마음을 지켜 줘!</span><button class="missionstart" id="missionBtn">🚀 30초 도전</button><div class="missiontime" id="missionTime" style="display:none"><span id="timeNum">30초</span><div class="missiontrack"><div class="missionfill" id="missionFill"></div></div></div></div>
  <section class="frame" id="frame">
    <div class="canvas-sticker" id="sceneTitle">🧱 블록 놀이</div><div class="canvas-sub" id="sceneHint">블록 탑을 톡! 블록도 손으로 옮겨 봐!</div>
    <canvas id="game" width="1120" height="650" aria-label="마음이 쿵 터치 놀이 화면. 손으로 물건을 누르거나 끌어 보세요"></canvas>
    <div class="toast" id="toast" aria-live="polite"></div>
  </section>
  <div class="bottombar"><div class="reacttext" role="status"><span class="reacticon" id="reactIcon">👆</span><span id="reactText">무엇이 움직일까? 여기저기 눌러 봐!</span></div><div class="actions"><button class="bottom-btn reset" id="resetBtn">🔄 다시 놀기</button><button class="bottom-btn next" id="nextBtn">다른 곳으로 ➜</button></div></div>
  <div class="challengeinfo"><span>👆 여기저기 눌러서 장난도 쳐 보고</span><span>😯 친구 표정도 관찰하고</span><span>💗 스스로 다시 바로잡아 보자!</span><b>미션은 선택! 제한 없이 자유롭게 놀아도 돼요.</b></div>
  <p class="tiny">오프라인 작동 · 태블릿 터치·끌기 지원 · 한국어 음성 다운로드 불필요 · 음향은 소리 버튼으로 조절</p>
</main>
<script>
'use strict';
const W=1120,H=650,canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id),TAU=Math.PI*2;
const COLORS=['#ff849c','#64bcff','#ffd166','#a68af4','#77ddb0','#fda761'];
const INFO=[
 ['🧱 블록 놀이','블록 탑을 톡! 무너뜨린 뒤 다시 쌓아 봐!','👆 블록 탑을 누르거나 블록을 옮겨 봐!'],
 ['⚽ 공 놀이터','공을 잡고 끌어 던져 봐! 친구도 반응해!','⚽ 공을 끌었다 놓거나 공을 톡 눌러 봐!'],
 ['🎨 물감 놀이','물감 통을 톡! 그림과 물감 자국도 만져 봐!','🖌 색깔 통을 누르고, 스펀지를 옮겨 봐!'],
 ['🍱 급식 줄','파란 옷 친구를 앞뒤로 끌어 봐!','👟 파란 옷 친구를 앞뒤로 옮겨 봐!'],
 ['🧸 정리 놀이','장난감도 장난! 제자리로 보내는 건 내 몫!','🧸 장난감을 휙! 장난감 통으로 쏙!'],
 ['✏️ 연필 사건','친구의 예쁜 연필을 몰래 집으면? 빌리고 돌려줘!','✏️ 연필을 끌어 보고 친구에게 물어 봐!'],
 ['🖼️ 그림 낙서','그림에 낙서도 하고 지우개로 싹싹 지워 봐!','🖍️ 색연필로 그려 보고 지우개로 문질러 봐!'],
 ['🪄 외로운 친구','혼자 앉은 친구는 어떤 마음일까? 여러 번 터치!','💗 친구 마음을 살펴보고 다가가 봐!'],
 ['☔ 비 오는 날','물웅덩이 첨벙! 우산을 친구에게 옮겨 봐!','☔ 우산을 끌어서 비 맞는 친구를 지켜 줘!'],
 ['🎤 발표 시간','무대 소리도 눌러 보고 친구에게 박수를 쳐 줘!','👏 박수 버튼을 마구 눌러서 응원해 봐!']
];
let scene=0,hearts=0,soundOn=true,ac=null,tm=0,last=0,shake=0,toastTimer=0,hotspots=[],particles=[],floaters=[],drag=null,down=null,progress=Array(10).fill(false),state={};
let mx=550,my=390;let baseline=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function dist(x,y,a,b){return Math.hypot(x-a,y-b)}
function rrect(x,y,w,h,r,fill,stroke=null,sw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(.1,ry),0,0,TAU);ctx.fillStyle=color;ctx.fill()}
function line(points,color,width=4){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function text(v,x,y,size=25,color='#50475e',align='center',weight=900){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(v,x,y)}
function emoji(v,x,y,size=50,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,0,1);ctx.restore()}
function star(x,y,r,color='#fff'){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,R=(i%2)?r*.46:r;ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R)}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore()}
function spark(x,y,n=11,colors=COLORS){for(let i=0;i<n;i++){let a=Math.random()*TAU,s=rnd(1.4,5);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,life:rnd(35,69),max:70,color:colors[i%colors.length],r:rnd(4,9),shape:i%3})}}
function bigHeart(x,y){for(let i=0;i<14;i++)particles.push({x,y,vx:rnd(-3,3),vy:rnd(-5,-1),life:rnd(60,100),max:100,color:'#ff70a6',r:rnd(6,14),shape:3})}
function shout(s,icon='💬',duration=2600){$('reactText').textContent=s;$('reactIcon').textContent=icon;state.messageAt=performance.now()+duration}
function bubble(x,y,s,emojiChar=''){floaters.push({x,y,s,emojiChar,life:145,max:145});if(floaters.length>9)floaters.shift()}
function pop(s,good=false){const el=$('toast');el.textContent=s;el.className='toast';void el.offsetWidth;el.classList.add('show');if(good)confetti();}
function confetti(){for(let i=0;i<64;i++){let x=rnd(220,900);particles.push({x,y:rnd(5,75),vx:rnd(-2,2),vy:rnd(-1,3),life:rnd(100,190),max:190,color:COLORS[i%COLORS.length],r:rnd(5,10),shape:i%3})}}
function heart(message){const wonMission=mission.active;hearts++;$('heartCount').textContent=hearts;sfx('win');spark(550,240,24);bigHeart(560,270);pop(wonMission?'🏆 번개 미션 성공!':'💗 마음 +1!',true);shout(message,'🥰',3500);if(wonMission)completeMission();progress[scene]=true;document.querySelectorAll('.scene-tab')[scene].classList.add('done')}
function getAudio(){if(!soundOn)return null;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(freq=550,dur=.14,type='sine',vol=.08,slide=0,delay=0){let a=getAudio();if(!a)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,freq+slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
let musicOn=false,musicTimer=null,musicStep=0;
function noiseBurst(dur=.12,vol=.09,filterFreq=1600,delay=0){
 const a=getAudio();if(!a)return;const length=Math.round(a.sampleRate*dur),buf=a.createBuffer(1,length,a.sampleRate),ch=buf.getChannelData(0);
 for(let i=0;i<length;i++)ch[i]=(Math.random()*2-1)*Math.exp(-i/length*7);
 const source=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();source.buffer=buf;filter.type='lowpass';filter.frequency.value=filterFreq;gain.gain.value=vol;source.connect(filter);filter.connect(gain);gain.connect(a.destination);source.start(a.currentTime+delay);
}
function sfx(k){
 if(k==='tap'){tone(570,.075,'sine',.043,130)}
 else if(k==='boing'){tone(220,.31,'triangle',.11,510);tone(490,.17,'sine',.055,-180,.075);tone(840,.095,'sine',.025,-130,.11)}
 else if(k==='oops'){tone(530,.18,'triangle',.073,-260);tone(230,.25,'sine',.065,-100,.14);noiseBurst(.05,.035,800)}
 else if(k==='splash'){noiseBurst(.22,.12,2300);tone(140,.21,'sine',.064,190);tone(590,.12,'triangle',.045,-110,.09)}
 else if(k==='throw'){tone(160,.29,'sawtooth',.032,620);tone(410,.15,'sine',.06,390,.065);noiseBurst(.11,.037,2600)}
 else if(k==='win'){[0,.09,.19,.31,.42,.56].forEach((d,i)=>tone([523,659,784,988,1175,1568][i],.19,'triangle',.065,20,d));noiseBurst(.29,.035,5100,.28)}
 else if(k==='silly'){tone(320,.16,'square',.026,320);tone(620,.17,'sine',.075,-330,.08);tone(205,.15,'triangle',.06,120,.16)}

function releaseDrag(d,p){
 if(d.type==='pencil'){releasePencil(d,p);return}
 if(d.type==='eraser'){wipeDoodle();return}
 if(d.type==='marker'||d.type==='scribble'){if(d.type==='marker')doodlePrank();return}
 if(d.type==='umbrella'){releaseUmbrella(d,p);return}
 if(d.type==='block'){
   if(p.x>480&&p.x<690&&p.y>250&&p.y<570){fixBlock(d.id)}
   else{let b=state.blocks.pieces[d.id];b.x=clamp(d.x,330,790);b.y=clamp(d.y,420,565);bubble(b.x,b.y-42,'데굴데굴!');sfx('boing')}
 }
 else if(d.type==='ball'){
   let b=state.ball;b.x=clamp(d.x,45,W-45);b.y=clamp(d.y,100,535);
   // swipe inertia. Releasing directly over a friend/goal also works.
   b.vx=clamp((p.x-d.startX)*.075,-21,22);b.vy=clamp((p.y-d.startY)*.065-2,-18,17);
   if(Math.hypot(b.vx,b.vy)<2){b.vx=8;b.vy=-7}
   b.moving=true;b.reset=0;sfx('throw');spark(b.x,b.y,13);
   shout('슝~! 어디로 날아갈까?','⚽');
 }
 else if(d.type==='pot'){
   if(p.x>920&&p.y>170&&p.y<560){addPaint(d.id,990,340,true)}
   else if(p.x>630&&p.x<925&&p.y>165&&p.y<475){addPaint(d.id,p.x,p.y,false)}
   else if(p.x<310&&p.y>360){addPaint(d.id,855,425,true)}
   else addPaint(d.id,null,null,false);
 }
 else if(d.type==='sponge'){if(p.x>610||state.paintMess)wipePaint();else{bubble(d.x,d.y-48,'퐁퐁~');sfx('splash')}}
 else if(d.type==='lineKid'){
   if(p.x>730)cutLine();else if(p.x<380)returnLine();else{state.line.x=clamp(p.x,240,880);sfx('boing');bubble(p.x,p.y-175,'슝~')}
 }
 else if(d.type==='toy'){
   if(p.x>820&&p.y>340){addToy(d.id)}
   else if(p.x<335&&p.y>300){react('left','surprise','앗! 장난감이!',229,310,'😲');sfx('silly');spark(p.x,p.y,11);const it=state.toys[d.id];it.x=rnd(390,790);it.y=rnd(505,557);shout('장난감이 친구에게 날아가서 깜짝 놀랐어!','😯')}
   else{let it=state.toys[d.id];it.x=clamp(p.x,352,790);it.y=clamp(p.y,425,555);sfx('boing')}
 }
}
function tapDrag(d,p){
 switch(d.type){
 case 'block':fixBlock(d.id);break;
 case 'ball':{let b=state.ball;if(b.moving)return;
      b.moving=true;b.reset=0;
      if(b.prank%2===0){b.vx=-13.5;b.vy=-7.7;shout('공이 친구 쪽으로 슝~!','😯')}
      else{b.vx=18;b.vy=-11.7;shout('이번엔 골대를 향해 슝!','⚽')}
      sfx('throw');break}
 case 'pot':addPaint(d.id);break;
 case 'sponge':wipePaint();break;
 case 'lineKid':if(state.line.cut)returnLine();else cutLine();break;
 case 'toy':addToy(d.id);break;
 case 'pencil':tapPencil();break;
 case 'eraser':wipeDoodle();break;
 case 'marker':doodlePrank();break;
 case 'umbrella':tapUmbrella();break;
 case 'scribble':doodlePrank();break;
 }
}
function pokeKid(name,x,y){
 let counterKey='pokes_'+name;state[counterKey]=(state[counterKey]||0)+1;
 const n=state[counterKey],words=['으앗! 간지러워!','아하하, 깜짝!','또 누르는 거야?','나랑 놀자!','앗! 그만~!'];
 const emotion=['surprise','happy','angry','love','sad'][(n-1)%5];
 react(name,emotion,words[(n-1)%5],x,y,emotion==='sad'?'😟':'😜');sfx(n%2?'boing':'silly');spark(x,y+13,9);
}
function tapWorld(x,y){
 let h=findHot(x,y);sfx('tap');spark(x,y,7);
 if(!h){if(Math.random()<.54){bubble(x,y-25,['뿅!','반짝!','콕!','톡톡!','꺄륵!'][Math.floor(Math.random()*5)]);sfx('pop')}spark(x,y,7);return}
 const a=h.action,id=h.meta?.id;
 if(a==='childLeft'){pokeKid('left',scene===4?240:scene===1?310:scene===2?120:270,310);return}
 if(a==='childRight'){pokeKid('right',scene===1?723:scene===2?1030:882,310);return}
 if(a==='tower'){
   state.blocks.taps++;state.blocks.wobble=1.6;
   if(state.blocks.taps>=2){kickBlocks()}
   else{react('right','surprise','어어? 흔들린다!',882,308,'😮');sfx('boing');shout('블록 탑이 흔들흔들! 또 누르면 어떻게 될까?','🧱');spark(569,360,16)}
   return
 }
 if(a==='looseBlock'){fixBlock(id);return}
 if(a==='bear'){sfx('silly');bubble(188,404,'곰돌이 인사!');spark(188,468,11);return}
 if(a==='bell'){sfx('win');bubble(1030,410,'딸랑딸랑!');spark(1030,476,12);return}
 if(a==='ball'){tapDrag({type:'ball'});return}
 if(a==='pot'){addPaint(id);return}
 if(a==='sponge'){wipePaint();return}
 if(a==='canvas'){let i=(state.paintMarks.length)%3;addPaint(i,x,y);return}
 if(a==='friendDrawing'){addPaint((state.paintMarks.length)%3,990,331,true);return}
 if(a==='childA'){pokeKid('a',450,316);return}
 if(a==='childB'){pokeKid('b',614,316);return}
 if(a==='childC'){pokeKid('c',775,316);return}
 if(a==='player'){if(state.line.cut)returnLine();else cutLine();return}
 if(a==='back'){returnLine();return}
 if(a==='lunch'){sfx('silly');bubble(973,249,'와! 맛있는 급식!');spark(970,322,19);return}
 if(a==='toy'){addToy(id);return}
 if(a==='box'){sfx('boing');bubble(955,396,'여기에 쏙!');spark(959,463,13);return}
 if(a==='plane'){flyPlane();return}
 if(scene===5){if(a==='pencil'){tapPencil();return}if(a==='ask'){askPencil();return}if(a==='returnPencil'){returnPencil();return}if(a==='pencilKid'){pokeKid('pencilFriend',834,304);return}if(a==='pencilCase'){sfx('pop');bubble(351,363,'색연필 통 반짝!');spark(365,410,15);return}}
 if(scene===6){if(a==='marker'){doodlePrank();return}if(a==='eraser'){wipeDoodle();return}if(a==='drawing'){addDoodleMark(x,y);doodlePrank();return}if(a==='doodleKid'){pokeKid('doodleFriend',927,306);return}}
 if(scene===7){if(a==='lonelyFriend'){touchLonely();return}if(a==='friendInvite'){inviteLonely();return}if(a==='lonelyBalloon'){balloonPop(x,y);return}if(a==='lonelyToy'){giftLonely();return}}
 if(scene===8){if(a==='rainUmbrella'){tapUmbrella();return}if(a==='puddle'){splashPuddle(x,y);return}if(a==='rainFriend'){pokeKid('rainFriend',821,308);return}}
 if(scene===9){if(a==='stageClap'){clapStage();return}if(a==='stageCheer'){cheerStage();return}if(a==='stageTease'){teaseStage();return}if(a==='mic'){sfx('pop');bubble(581,295,'하나 둘! 🎤');return}if(a==='stageKid'){pokeKid('stageKid',569,306);return}}
}
function drawDragOverlay(){if(!drag||!drag.moved)return;
 if(drag.type==='umbrella'){emoji('💦',drag.x+115,drag.y-140,44)}
 if(drag.type==='pencil'){emoji('✨',drag.x+48,drag.y-40,35)}
 if(drag.type==='eraser'){rrect(drag.x-35,drag.y-22,70,44,9,'#fff0b9','#fff',5);emoji('🫧',drag.x,drag.y-35,29)}
 if(drag.type==='marker'){emoji('🖍️',drag.x,drag.y,58)}
 if(drag.type==='pot'){ctx.save();ctx.globalAlpha=.83;paintPot(drag.x,drag.y,['#ff79ad','#65bdfa','#f8cf52'][drag.id],drag.id);ctx.restore();emoji('🎨',drag.x+42,drag.y-45,37)}
 if(drag.type==='sponge'){ctx.save();ctx.globalAlpha=.92;rrect(drag.x-39,drag.y-22,78,47,12,'#ffe995','#fff6ca',4);ctx.restore();emoji('🫧',drag.x,drag.y-35,32)}
 if(drag.type==='toy'||drag.type==='block'){
    // placement glow
    let x=scene===4?957:570,y=scene===4?482:385;
    ctx.save();ctx.globalAlpha=.35+Math.sin(tm*.008)*.13;ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.setLineDash([15,10]);ctx.strokeRect(x-84,y-81,168,164);ctx.setLineDash([]);ctx.restore();
 }
 if(drag.type==='lineKid'){
   ctx.save();ctx.globalAlpha=.8;emoji('↔️',drag.x,316,45);ctx.restore();
 }
}
// overlay is part of the same animated canvas, layered above interactive objects
const originalDrawParticles=drawParticles;
drawParticles=function(dt){drawDragOverlay();originalDrawParticles(dt)};
canvas.addEventListener('pointerdown',pointerDown,{passive:false});
canvas.addEventListener('pointermove',pointerMove,{passive:false});
canvas.addEventListener('pointerup',pointerUp,{passive:false});
canvas.addEventListener('pointercancel',e=>{down=null;drag=null});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.scene-tab').forEach(el=>el.addEventListener('click',()=>setupScene(+el.dataset.scene)));
$('missionBtn').addEventListener('click',startMission);
$('musicBtn').addEventListener('click',()=>{if(musicOn)stopMusic();else startMusic()});
$('nextBtn').addEventListener('click',()=>setupScene(scene+1));
$('resetBtn').addEventListener('click',()=>{setupScene(scene);pop('🔄 다시 시작!')});
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';$('soundBtn').setAttribute('aria-label',soundOn?'효과음 끄기':'효과음 켜기');if(!soundOn)stopMusic();if(soundOn)sfx('win')});
$('fullBtn').addEventListener('click',async()=>{try{let f=$('frame');if(!document.fullscreenElement){await f.requestFullscreen?.();if(screen.orientation?.lock){screen.orientation.lock('landscape').catch(()=>{})}}else await document.exitFullscreen()}catch(e){shout('태블릿에서 가로 모드로 돌려 보면 더 커져요!','📱')}});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')setupScene(scene+1);if(e.key==='ArrowLeft')setupScene(scene-1);if(e.key==='r'||e.key==='R')setupScene(scene)});
setupScene(0);requestAnimationFrame(render);
</script>
